<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Infinite Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Figma-style Top Left Title / Status -->
    <header class="figma-header">
      <div class="header-left-group">
        <!-- Sidebar Toggle Button -->
        <button class="icon-btn" id="btn-toggle-layers" title="Toggle Layers Sidebar (Alt+L)" aria-label="Toggle Layers">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>

        <div class="brand-badge">
          <span class="project-title">Trading Canvas</span>
          <span class="badge-tag">Pro</span>
        </div>

        <!-- Undo & Redo Controls -->
        <div class="control-group">
          <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M3 7v6h6"/>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
            </svg>
          </button>
          <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M21 7v6h-6"/>
              <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="header-center-info">
        <span class="coordinate-pill" id="coord-display">X: 0 Y: 0</span>
      </div>

      <div class="header-actions">
        <!-- Add Stock Chart Button -->
        <button class="primary-btn" id="btn-open-stock-modal" title="Add Stock Chart (C)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Add Stock Chart</span>
          <kbd>C</kbd>
        </button>

        <!-- New Pine Script Button -->
        <button class="script-btn" id="btn-add-pinescript" title="New Pine Script (P)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          <span>New Pine Script</span>
          <kbd>P</kbd>
        </button>

        <!-- Add Section Frame Button (Figma Feature) -->
        <button class="icon-btn" id="btn-add-section" title="Add Section Frame (S)" aria-label="Add Section">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="3" stroke-dasharray="3 3"/>
            <path d="M3 9h8"/>
          </svg>
        </button>

        <!-- Sticky Note Button (Figma Feature) -->
        <button class="icon-btn" id="btn-add-note" title="Add Sticky Note (N)" aria-label="Add Sticky Note">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </button>

        <!-- Arrange / Layout Button -->
        <button class="icon-btn" id="btn-arrange-charts" title="Auto-Arrange Diamond / Grid" aria-label="Auto Arrange">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
            <rect x="2" y="2" width="5" height="5" rx="1"/>
            <rect x="9" y="2" width="5" height="5" rx="1"/>
            <rect x="2" y="9" width="5" height="5" rx="1"/>
            <rect x="9" y="9" width="5" height="5" rx="1"/>
          </svg>
        </button>

        <!-- Export Board as PNG -->
        <button class="icon-btn" id="btn-export-canvas" title="Export Canvas as PNG Image" aria-label="Export Board">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>

        <!-- Grid Style Selector -->
        <div class="control-group">
          <button class="icon-btn active" id="btn-grid-dots" title="Dot Grid" aria-label="Dot Grid">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
              <circle cx="3" cy="3" r="1.5"/>
              <circle cx="8" cy="3" r="1.5"/>
              <circle cx="13" cy="3" r="1.5"/>
              <circle cx="3" cy="8" r="1.5"/>
              <circle cx="8" cy="8" r="1.5"/>
              <circle cx="13" cy="8" r="1.5"/>
              <circle cx="3" cy="13" r="1.5"/>
              <circle cx="8" cy="13" r="1.5"/>
              <circle cx="13" cy="13" r="1.5"/>
            </svg>
          </button>
          <button class="icon-btn" id="btn-grid-lines" title="Square Grid" aria-label="Square Grid">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <line x1="1" y1="5.5" x2="15" y2="5.5"/>
              <line x1="1" y1="10.5" x2="15" y2="10.5"/>
              <line x1="5.5" y1="1" x2="5.5" y2="15"/>
              <line x1="10.5" y1="1" x2="10.5" y2="15"/>
            </svg>
          </button>
          <button class="icon-btn" id="btn-grid-none" title="Plain Canvas" aria-label="Plain Canvas">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="2" y="2" width="12" height="12" rx="2" stroke-dasharray="2 2"/>
            </svg>
          </button>
        </div>

        <!-- Minimap Radar Toggle -->
        <button class="icon-btn active" id="btn-toggle-minimap" title="Toggle Minimap Radar (M)" aria-label="Toggle Radar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3a9 9 0 0 1 9 9"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>

        <!-- Inspector Properties Toggle -->
        <button class="icon-btn active" id="btn-toggle-inspector" title="Toggle Inspector Panel (Alt+R)" aria-label="Toggle Inspector">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
          </svg>
        </button>

        <!-- Theme Toggle -->
        <button class="icon-btn" id="btn-theme-toggle" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
          <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Figma Left Sidebar: Layers & Assets Panel -->
    <aside class="figma-sidebar figma-left-sidebar" id="figma-left-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" id="tab-btn-layers" data-tab="layers">Layers</button>
          <button class="sidebar-tab" id="tab-btn-assets" data-tab="assets">Assets</button>
        </div>
        <button class="sidebar-close-btn" id="btn-close-left-sidebar" title="Collapse (Alt+L)">✕</button>
      </div>

      <!-- Layers Tab -->
      <div class="sidebar-tab-pane" id="pane-layers">
        <div class="layers-filter-box">
          <input type="text" id="layers-filter-input" placeholder="Search layers..." autocomplete="off" />
        </div>
        <div class="layers-tree-list" id="layers-tree-list"></div>
      </div>

      <!-- Assets Tab -->
      <div class="sidebar-tab-pane hidden" id="pane-assets">
        <div class="assets-group-title">Stock Tickers</div>
        <div class="quick-assets-grid" id="quick-stocks-grid"></div>
        <div class="assets-group-title" style="margin-top: 14px;">Pine Scripts</div>
        <div class="quick-assets-grid" id="quick-scripts-grid"></div>
      </div>
    </aside>

    <!-- Figma Right Sidebar: Design & Properties Inspector -->
    <aside class="figma-sidebar figma-right-sidebar" id="figma-right-sidebar">
      <div class="sidebar-header">
        <span class="inspector-title">Design</span>
        <button class="sidebar-close-btn" id="btn-close-right-sidebar" title="Collapse (Alt+R)">✕</button>
      </div>

      <div class="sidebar-content" id="inspector-content">
        <!-- Alignment Toolbar -->
        <div class="inspector-section">
          <div class="align-btn-group">
            <button class="align-btn" id="btn-align-left" title="Align Left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="2" x2="4" y2="22"/><rect x="4" y="6" width="12" height="4" rx="1"/><rect x="4" y="14" width="8" height="4" rx="1"/></svg></button>
            <button class="align-btn" id="btn-align-center-h" title="Align Horizontal Centers"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><rect x="6" y="6" width="12" height="4" rx="1"/><rect x="8" y="14" width="8" height="4" rx="1"/></svg></button>
            <button class="align-btn" id="btn-align-right" title="Align Right"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="20" y1="2" x2="20" y2="22"/><rect x="8" y="6" width="12" height="4" rx="1"/><rect x="12" y="14" width="8" height="4" rx="1"/></svg></button>
            <div class="align-divider"></div>
            <button class="align-btn" id="btn-align-top" title="Align Top"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="4" x2="22" y2="4"/><rect x="6" y="4" width="4" height="12" rx="1"/><rect x="14" y="4" width="4" height="8" rx="1"/></svg></button>
            <button class="align-btn" id="btn-align-center-v" title="Align Vertical Centers"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="12" x2="22" y2="12"/><rect x="6" y="6" width="4" height="12" rx="1"/><rect x="14" y="8" width="4" height="8" rx="1"/></svg></button>
            <button class="align-btn" id="btn-align-bottom" title="Align Bottom"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="20" x2="22" y2="20"/><rect x="6" y="8" width="4" height="12" rx="1"/><rect x="14" y="12" width="4" height="8" rx="1"/></svg></button>
          </div>
        </div>

        <!-- Position & Size Inputs (X, Y, W, H) -->
        <div class="inspector-section" id="inspector-transform-section">
          <div class="inspector-section-label">Position & Size</div>
          <div class="prop-inputs-grid">
            <div class="prop-input-item">
              <span class="prop-prefix">X</span>
              <input type="number" id="prop-input-x" />
            </div>
            <div class="prop-input-item">
              <span class="prop-prefix">Y</span>
              <input type="number" id="prop-input-y" />
            </div>
            <div class="prop-input-item">
              <span class="prop-prefix">W</span>
              <input type="number" id="prop-input-w" />
            </div>
            <div class="prop-input-item">
              <span class="prop-prefix">H</span>
              <input type="number" id="prop-input-h" />
            </div>
          </div>
        </div>

        <!-- Dynamic Context-specific Inspector -->
        <div id="inspector-dynamic-props"></div>
      </div>
    </aside>

    <!-- Figma Minimap Radar -->
    <div class="canvas-minimap" id="canvas-minimap">
      <div class="minimap-header">
        <span>Minimap Radar</span>
        <button id="btn-close-minimap" class="minimap-btn" title="Hide Radar">✕</button>
      </div>
      <canvas id="minimap-canvas" width="180" height="110"></canvas>
    </div>

    <!-- World Objects Container (Transforms with Canvas Pan & Zoom) -->
    <div id="canvas-world">
      <div id="world-frames"></div>
    </div>

    <!-- SVG Connector Wires Layer (Screen Space Overlay) -->
    <svg id="canvas-wires" xmlns="http://www.w3.org/2000/svg"></svg>

    <!-- Figma-Style Drag Selection Box -->
    <div id="canvas-selection-box" class="canvas-selection-box"></div>

    <!-- Stock Picker Modal (Figma Quick Insert Style) -->
    <div class="modal-overlay hidden" id="stock-modal-overlay">
      <div class="stock-modal" id="stock-modal">
        <div class="modal-header">
          <div class="modal-search-wrapper">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="stock-search-input" placeholder="Search stock or crypto (e.g. NVDA, AAPL, BTC, TSLA)..." autocomplete="off" />
          </div>
          <button class="modal-close-btn" id="btn-close-modal" aria-label="Close modal">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="modal-categories">
          <button class="cat-pill active" data-cat="all">All</button>
          <button class="cat-pill" data-cat="tech">Tech Giants</button>
          <button class="cat-pill" data-cat="crypto">Crypto</button>
          <button class="cat-pill" data-cat="index">Indices</button>
        </div>

        <div class="stock-list" id="stock-list-container">
          <!-- Populated by JS -->
        </div>

        <div class="modal-footer">
          <span>Click any stock to add its interactive chart to the canvas</span>
          <kbd>ESC</kbd>
        </div>
      </div>
    </div>

    <!-- Figma-style Floating Bottom Zoom Toolbar -->
    <div class="figma-toolbar">
      <div class="toolbar-pill">
        <button class="tool-btn" id="btn-zoom-out" title="Zoom Out (Ctrl + Minus)" aria-label="Zoom out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>

        <button class="zoom-level-btn" id="btn-zoom-reset" title="Click to Reset Zoom to 100%">
          <span id="zoom-text">100%</span>
        </button>

        <button class="tool-btn" id="btn-zoom-in" title="Zoom In (Ctrl + Plus)" aria-label="Zoom in">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>

        <div class="toolbar-divider"></div>

        <button class="tool-btn" id="btn-center" title="Recenter Canvas (Shift + 1)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Quick navigation hint -->
    <div class="canvas-hints" id="canvas-hints">
      <span>Drag Canvas or Hold <kbd>Space</kbd> &bull; Press <kbd>C</kbd> to Add Stock Chart &bull; Drag Chart Frames to Move</span>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
